<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#090d16;border-radius:16px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Roboto','Helvetica Neue',Arial,sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070a13"/>
    </linearGradient>
    
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.3"/>
    </linearGradient>

    <radialGradient id="glowPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    /* Keyframe Animations */
    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); opacity: 0.3; }
      50% { transform: scale(1.15); opacity: 0.6; }
    }
    @keyframes heartbeatLine {
      0% { stroke-dashoffset: 1200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatPillReverse {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes blinkDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
    }
    @keyframes sweepRadar {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .glow-bg {
      transform-origin: 600px 180px;
      animation: pulseGlow 8s ease-in-out infinite;
    }
    .ecg-line {
      stroke-dasharray: 1200;
      animation: heartbeatLine 4s linear infinite;
    }
    .pill-1 { animation: floatPill 6s ease-in-out infinite; }
    .pill-2 { animation: floatPillReverse 7s ease-in-out infinite; }
    .pill-3 { animation: floatPill 5.5s ease-in-out infinite; }
    .pill-4 { animation: floatPillReverse 6.5s ease-in-out infinite; }
    .live-dot {
      transform-origin: center;
      animation: blinkDot 1.8s ease-in-out infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>

  <!-- Ambient Glow Behind Elements -->
  <circle cx="600" cy="180" r="280" fill="url(#glowPulse)" class="glow-bg"/>
  <circle cx="200" cy="80" r="180" fill="#38bdf8" opacity="0.04"/>
  <circle cx="1020" cy="280" r="220" fill="#818cf8" opacity="0.05"/>

  <!-- Subtle Perspective Grid / Matrix in Background -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="450" y1="0" x2="450" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="750" y1="0" x2="750" y2="360"/>
    <line x1="900" y1="0" x2="900" y2="360"/>
    <line x1="1050" y1="0" x2="1050" y2="360"/>
  </g>

  <!-- Dynamic Heartbeat / Site Health ECG Wave (Background Layer - y=300 to y=330) -->
  <path d="M 0 310 L 180 310 L 210 310 L 225 285 L 240 335 L 255 260 L 270 335 L 285 300 L 300 310 L 520 310 L 535 285 L 550 340 L 565 255 L 580 345 L 595 300 L 610 310 L 820 310 L 835 280 L 850 340 L 865 260 L 880 330 L 895 295 L 910 310 L 1200 310" 
        fill="none" 
        stroke="url(#primaryGrad)" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        class="ecg-line"
        opacity="0.45"/>

  <!-- Left Dynamic Floating Pill (Uptime 99.99%) -->
  <g class="pill-1" transform="translate(60, 50)">
    <rect width="210" height="42" rx="21" fill="#0f172a" stroke="#334155" stroke-width="1.2" filter="url(#cardShadow)"/>
    <circle cx="24" cy="21" r="5" fill="#10b981" class="live-dot"/>
    <text x="38" y="26" fill="#94a3b8" font-size="12" font-weight="500">Global Uptime:</text>
    <text x="124" y="26" fill="#34d399" font-size="13" font-weight="700">99.99%</text>
  </g>

  <!-- Left Dynamic Floating Pill 2 (Core Web Vitals Pass) -->
  <g class="pill-2" transform="translate(45, 230)">
    <rect width="230" height="42" rx="21" fill="#0f172a" stroke="#334155" stroke-width="1.2" filter="url(#cardShadow)"/>
    <circle cx="24" cy="21" r="5" fill="#38bdf8" class="live-dot"/>
    <text x="38" y="26" fill="#94a3b8" font-size="12" font-weight="500">Core Web Vitals:</text>
    <text x="145" y="26" fill="#38bdf8" font-size="13" font-weight="700">100 / 100</text>
  </g>

  <!-- Right Dynamic Floating Pill (Audit Health Score) -->
  <g class="pill-3" transform="translate(930, 50)">
    <rect width="210" height="42" rx="21" fill="#0f172a" stroke="#334155" stroke-width="1.2" filter="url(#cardShadow)"/>
    <circle cx="24" cy="21" r="5" fill="#a855f7" class="live-dot"/>
    <text x="38" y="26" fill="#94a3b8" font-size="12" font-weight="500">Technical SEO:</text>
    <text x="130" y="26" fill="#c084fc" font-size="13" font-weight="700">Audit 98%</text>
  </g>

  <!-- Right Dynamic Floating Pill 2 (Status: All Systems Operational) -->
  <g class="pill-4" transform="translate(915, 230)">
    <rect width="240" height="42" rx="21" fill="#0f172a" stroke="#334155" stroke-width="1.2" filter="url(#cardShadow)"/>
    <circle cx="24" cy="21" r="5" fill="#10b981" class="live-dot"/>
    <text x="38" y="26" fill="#94a3b8" font-size="12" font-weight="500">Status:</text>
    <text x="88" y="26" fill="#10b981" font-size="13" font-weight="700">All Nodes Active</text>
  </g>

  <!-- CENTER FOREGROUND CONTENT (Guaranteed never covered by any background dynamic elements) -->
  
  <!-- Category Over-Title Pill -->
  <g transform="translate(600, 78)">
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
    <text x="0" y="5" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1.8" text-anchor="middle">CURATED AWESOME DIRECTORY</text>
  </g>

  <!-- Main Hero Title -->
  <text x="600" y="142" text-anchor="middle" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
    Webmaster Tools &amp; Site Health
  </text>
  <text x="600" y="186" text-anchor="middle" font-size="34" font-weight="900" fill="url(#primaryGrad)" letter-spacing="-0.5">
    Monitoring Ecosystem
  </text>

  <!-- Subtitle / Meta Description Line -->
  <text x="600" y="222" text-anchor="middle" font-size="14.5" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
    Commercial SaaS Platforms &amp; Open-Source Software for Technical SEO, Crawl Audits &amp; Uptime Tracking
  </text>

  <!-- Micro Feature Badges in Foreground -->
  <g transform="translate(600, 260)">
    <!-- Badge 1: SEO Audits -->
    <rect x="-240" y="0" width="110" height="24" rx="12" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
    <text x="-185" y="16" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">🔍 Technical SEO</text>

    <!-- Badge 2: Uptime -->
    <rect x="-118" y="0" width="110" height="24" rx="12" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
    <text x="-63" y="16" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">⏱️ Uptime 24/7</text>

    <!-- Badge 3: Web Vitals -->
    <rect x="4" y="0" width="110" height="24" rx="12" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
    <text x="59" y="16" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">⚡ Web Vitals</text>

    <!-- Badge 4: Open Source -->
    <rect x="126" y="0" width="118" height="24" rx="12" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
    <text x="185" y="16" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">🌐 Open Source</text>
  </g>
</svg>
